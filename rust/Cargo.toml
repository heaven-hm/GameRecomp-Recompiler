[package]
name = "gamerecomp-sdk"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
license = "AGPL-3.0-only"
description = "Rust client SDK for the GameReComp PE32 x86 recompilation pipeline"
repository = "https://github.com/heaven-hm/GameRecomp-SDK"
homepage = "https://github.com/heaven-hm/GameRecomp-SDK"
documentation = "https://docs.rs/gamerecomp-sdk"
keywords = ["recompiler", "pe32", "x86", "sdk", "gamerecomp"]
categories = ["development-tools", "api-bindings"]
include = [
    "Cargo.toml",
    "src/**/*.rs",
    "examples/*.rs",
    "tests/*.rs",
]

[lib]
name = "gamerecomp_sdk"
path = "src/lib.rs"
