name: SDK verification (pure Rust / Blaze)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Blaze
        run: |
          set -euo pipefail
          curl -fsSL https://ix.dev/blaze | sh
          blaze --version
      - name: Rust SDK check and tests
        working-directory: rust
        run: |
          set -o pipefail
          blaze check
          blaze test
