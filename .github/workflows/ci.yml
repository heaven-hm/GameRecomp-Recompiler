name: SDK verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python SDK
        run: python3 -m pytest python/tests -q
      - name: Rust SDK
        working-directory: rust
        run: cargo test
      - name: C SDK
        run: sh tests/test_c_sdk.sh
      - name: C++ SDK
        run: sh tests/test_cpp_sdk.sh
